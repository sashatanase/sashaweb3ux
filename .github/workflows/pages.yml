name: Deploy animations to GitHub Pages

# Publishes the contents of the `animations/` folder to GitHub Pages so the
# demos can be embedded (via <iframe>) in case studies on the main site.
# The main site itself continues to deploy to Cloudflare separately — this
# workflow only touches Pages.

on:
  push:
    branches: [main]
    paths:
      - "animations/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (source = GitHub Actions) on first run so no
          # manual toggle is needed in repo settings.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the animations folder as the site root, so
          # animations/index.html becomes the Pages home page.
          path: ./animations

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
